<!DOCTYPE html>
<html>
    <head>
        <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
    </style>
    </head>
    <body class="bg-dark text-white">
            <div class="container border border-3 border-white bg-dark rounded m-5 center p-5 mx-auto">
                <h1 class="text-white text-capitalize mb-1">register today</h1>
                <h6 class="text-white mb-4">Fill in the data below.</h6>
                
                <input type="text" class="form-control mb-3" placeholder="Full Name">
                <input type="email" class="form-control mb-3" placeholder="E-mail Address">
                <div>
                <select class="form-select mb-3" style="color: #6c757d;">
                    <option value="">Position</option>
                </select>
                </div>
                <input type="password" class="form-control mb-3" placeholder="Password">
                <div>
                    <label class="text-white mb-3">Gender</label>
                    <input type="checkbox" class="btn-check" id="btn-check1" autocomplete="off">
                    <label class="btn btn-outline-light text-white" for="btn-check1">Male</label>
                    <input type="checkbox" class="btn-check" id="btn-check2" autocomplete="off">
                    <label class="btn btn-outline-light text-white" for="btn-check2">Female</label>
                    <input type="checkbox" class="btn-check" id="btn-check3" autocomplete="off">
                    <label class="btn btn-outline-light text-white" for="btn-check3">Secret</label>
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" value="" id="checkDefault">
                    <label class="form-check-label" for="checkDefault">
                        I confirm that all data are correct
                    </label>
                </div>
                <button class="btn btn-secondary">Register</button>

            </div>
            

        <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
        
    </body>
</html>
