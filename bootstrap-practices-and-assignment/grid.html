 <!doctype html>
<html>
  <head>

            border: 1px solid rgb(15, 230, 51);
            background-color: lightblue;
            text-align: center;
        }
        .col-lg,.col-sm,.col-md{
            border: 1px solid rgb(15, 230, 51);
            background-color: lightblue;
            text-align: center;
        }
    </style>
  </head>
  <body>
     </div>
      <!--Grid System-->

          <div class="col-9">2</div>
          <div class="col">3</div>
          <div class="col">4</div>
        </div>
      </div>
      <!--Grid with breakpoints-->
      <div class="container">
        <div class="row">
            <div class="col-sm-8">small</div>
            <div class="col-md">mideum</div>
            <div class="col-lg">long</div>
        </div>
      </div>
